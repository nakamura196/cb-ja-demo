{%- assign t = site.data.locale[site.lang] -%}
{% comment %}

    Navbar search box.

    Form set up to use the default search page.

{%- endcomment -%}
<form role="search" id="nav-search" action="{{ '/search/index.html' | relative_url }}"> 
    <input id="nav-search-box" class="form-control" type="search" placeholder="{{ t.search | default: "Search" }}" aria-label="{{ t.search_collection_items | default: "Search collection items" }}" name="q">
</form>
